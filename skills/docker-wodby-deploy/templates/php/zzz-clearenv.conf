; Las imágenes wodby/php (y derivadas: wodby/drupal-php, wodby/wordpress-php,
; etc.) traen /usr/local/etc/php-fpm.d/zz-www.conf con "clear_env = yes" y
; sin reenviar ninguna variable — los workers de php-fpm (que atienden las
; peticiones web) quedan sin las variables de entorno del contenedor
; (DB_HOST/DB_USER/DB_PASSWORD/DB_NAME/etc.), aunque sí estén seteadas ahí
; ("docker compose exec php env" las muestra bien). Por eso un CLI como
; drush/wp-cli (hereda el entorno completo del contenedor) conecta bien a
; la DB, pero la web da "Access denied" o cae a credenciales por default —
; un bug confuso porque todo "se ve" bien configurado.
;
; Este archivo se monta en /usr/local/etc/php-fpm.d/ con un nombre que
; ordena alfabéticamente después de zz-www.conf (zzz > zz), así que su
; directiva gana para el pool [www].
[www]
clear_env = no
